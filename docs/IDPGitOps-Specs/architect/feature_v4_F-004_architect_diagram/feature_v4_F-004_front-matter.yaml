open:
  - "How are the rotator's own minting credentials rotated? They are the Kubernetes Secrets saas-rotator-bitbucket-creds and saas-rotator-jira-creds, neither of which is in the vault catalogue."
  - "The two alert thresholds (100 days age, 600 s skew) are numbers someone chose, not targets anyone agreed; 100 days against a 90-day rotation leaves a 10-day margin and nothing states whether that is the intent. Nothing records rotation outcomes over time — the age gauge is a level, not a history."
  - "Disabling superseded versions sits behind a type assertion on the store; a store that does not satisfy the disabler interface is skipped silently, with no log, and DOM-004-R8 would then not hold with nothing saying so. Production wires the real client, which does satisfy it."
  - "DOM-004-R7 holds today, verified with NULL_EXPIRY_MODE=block, but CI runs the validator in advisory mode, so a future secret can land without an expiry and only warn. When is the cutover to block?"
  - "F-004-US1 and F-004-US5 have no test; both are enforced by Terraform and a validator whose run conditions are not visible from the tree."
  - "DOM-004-R2 is enforced by convention and a comment; nothing states whether the catalogue validator runs on every change."
  - "Who is accountable for a secret whose consumer has been decommissioned? The catalogue records consumers but nothing prunes."
  - "tools/mgmt-plane-lock/internal/httpx is inside this feature's surface but is also imported by the drift bridge, which has no feature document and no route; a change made here reaches a binary nobody has specified."
  - "The metrics bootstrap package is claimed by F-002 and read by this feature. Both design pairs name a Metrics endpoint participant pointing at the same file; only F-002 owns it, so a change here belongs in F-002."
  - "The platform decision record lives at _docs/IDP-GitOps-ADRs-v2.md, outside this hub, so the decision identifiers this feature rests on cannot resolve through the route — the hub's decision directory holds only its own first record. Should each cited platform decision get a stub in the hub?"
