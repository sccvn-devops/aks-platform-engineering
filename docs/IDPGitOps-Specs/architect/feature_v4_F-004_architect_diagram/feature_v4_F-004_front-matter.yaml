# --- contracts: named here, shaped in data/ -----------------------------------
contracts:
  endpoints:             # -> data/schema/openapi_v4_F-004.json; outbound operations only, nothing served
    - "Put secret"
    - "Get secret"
    - "Disable old versions"
    - "Mint source-host token"
    - "Mint tracker token"
  events: []             # none as a message contract; the Key Vault alert topic is consumed by Azure Monitor, not by this code
  entities:              # $defs names in data/schema/schemas.json
    - akv_secret_entry
    - akv_secret_version
    - secret_write

depends_on:
  internal:
    - tools/mgmt-plane-lock/internal/httpx/httpx.go
    - tools/mgmt-plane-lock/internal/kube/status.go
    - tools/mgmt-plane-lock/internal/bootstrap/bootstrap.go
  external:
    - "Go 1.24.0"
    - "Azure Key Vault, two regional vaults — hard"
    - "Azure Workload Identity for the vault token — hard"
    - "F-002 arbitration — hard; rotation runs only where the cluster is active"
    - "SaaS APIs for minting — hard"
    - "Terraform 1.5.7 for the catalogue and the expiry boundary"

# --- the decision `requirement` made ------------------------------------------
approach:
  chosen: One catalogue split by write ownership, one Put/Get write path every caller programs against, and rotation as a small state machine whose first act after validation is a leadership check.
  because: >-
    Efficiency — a single client with a shared transport seam means timeouts, retries
    and redaction are configured once rather than per caller, and the expiry is computed
    in infrastructure from a quarterly boundary instead of being tracked at runtime.
    Robustness — four typed sentinels let callers branch on cause rather than on message
    text, the default write refuses to revive a soft-deleted secret, and no secret value
    can reach an error because bodies are redacted by default.
    Resilience — 5xx is retried three times with exponential backoff while 4xx is not,
    the grace period between publishing and disabling is interruptible within a second,
    and a failed disable is logged rather than fatal. What it does not buy is atomicity
    across the regional pair, which is declared as a failure mode.
  rejected:
    - "A per-caller vault client — rejected so there is exactly one write path and one place where redaction and retry policy live."
    - "Reviving a soft-deleted secret by default — rejected; recovery is an explicit strategy the caller opts into."
    - "Deleting superseded versions — rejected in favour of disabling them, so a rollback is possible."
    - "Rotating from any management cluster — rejected; the leadership gate is the only coupling between this feature and arbitration."
    - "An atomic dual-vault write — rejected, and confirmed as the intent on 2026-09-21: Key Vault offers no cross-vault transaction, and the scheduled job's on-failure retry already converges the pair. DOM-004-R3 states eventual consistency rather than atomicity."
  # Bare decision identifiers are deliberately not written here: the platform decision
  # record lives outside this hub, so an identifier in a routed document cannot resolve.
  adr: "_docs/IDP-GitOps-ADRs-v2.md — the secrets-operator-with-a-per-region-vault-pair and per-namespace-identity decisions. The rotation state machine, the grace period and the disable-rather-than-delete choice have no recorded decision at all."

# --- what must not break ------------------------------------------------------
invariants:
  - DOM-004-R1
  - DOM-004-R2
  - DOM-004-R3
  - DOM-004-R4
  - DOM-004-R5
  - DOM-004-R6
  - DOM-004-R7
  - DOM-004-R8
  - DOM-004-R9
  - DOM-004-R10
  - DOM-004-R11

failure_modes:
  - when: this cluster is not the active management cluster
    expect: return the skipped-not-active sentinel, log it and exit 0; nothing is minted and no vault is written
  - when: minting the new credential fails
    expect: abort the run naming the token type; neither vault is written
  - when: the West Europe vault write fails
    expect: abort before the second write, leaving the pair unchanged
  - when: the North Europe vault write fails after the West Europe write succeeded
    expect: abort with the regional pair inconsistent, then converge on the scheduled job's on-failure retry, which mints a fresh credential and rewrites both vaults; the skew alert covers an exhausted retry budget
  - when: the process is cancelled during the grace period
    expect: the interruptible sleep returns the context error within a second, leaving superseded versions enabled
  - when: disabling superseded versions fails
    expect: log it and continue; the run still succeeds with the new version live
  - when: the destination secret is soft-deleted and the strategy is the default
    expect: return the soft-deleted sentinel without reviving anything
  - when: the vault refuses the credential with a 401 or 403
    expect: return the auth-failed sentinel, carrying no secret value and no response body
  - when: the vault returns a 5xx
    expect: retry up to three times with exponential backoff, then return a redacted error
  - when: a platform-managed secret carries no expiry
    expect: NULL_EXPIRY_MODE=advisory reports and exits 0; NULL_EXPIRY_MODE=block exits non-zero. CI runs it in advisory mode today.

resilience:              # numbers, not adjectives; every one is testable
  timeout_ms: 30000      # per outbound attempt, set in the shared transport seam
  retry: "3 attempts, 5xx only, base backoff 200 ms doubling to a 5000 ms cap; no 4xx is retried"
  idempotency: "the secret name plus the vault's own versioning — a repeated Put adds a version rather than colliding, and disabling is by definition repeatable. A retried run mints a new credential rather than replaying the old one, which is what converges a divergent pair."
  degraded: "a standby cluster skips the run and exits 0; a failed disable is logged and not fatal; a write that fails between the two vaults leaves a real skew that only the exporter notices (alert above 600 s) until the on-failure retry converges it, and the grace period keeps the superseded version usable for 86400000 ms — 24 h, as deployed"

observability:
  logs:
    - "not the active management cluster, skipping rotation"
    - "wrote rotated token to both regional vaults"
    - "disable old versions"
    - "disabled old versions after grace period"
  metrics:
    - "saas_token_age_days — alert SaaSTokenAgeExceeded above 100 days"
    - "akv_dual_write_skew_seconds — alert PerRegionAKVDualWriteSkew above 600 s"
    - "near-expiry: Event Grid SecretNearExpiry and CertificateNearExpiry, 30 days ahead, not a metric"
  traces: []             # none

non_goals:
  - Projecting secrets into clusters — that is the secrets operator's job, referenced by the catalogue.
  - Access control — role assignments live in infrastructure, not here.
  - Certificate issuance — certificate material is referenced, not minted.
  - Repairing a skewed vault pair — the skew is exported, not corrected.
  - Modelling a secret value anywhere in this hub.
  - Owning the whole of terraform/locals.tf — only the two secret catalogue maps in it belong to this feature.

