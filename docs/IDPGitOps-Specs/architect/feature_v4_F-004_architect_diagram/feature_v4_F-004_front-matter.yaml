feature: "F-004"
version: "v4"
kind: front-matter
title: "Secret and token lifecycle"
status: ready            # draft | ready | accepted | superseded
owner: Platform Engineering
updated: "2026-09-21"

# --- activation: what an agent decides from the first ten lines ---------------
description: Every platform secret is declared in one catalogue, written through one path, carries an expiry, and — where it is a SaaS credential — is minted and replaced on a schedule by the active management cluster only.
