# --- where execution starts ---------------------------------------------------
entrypoints:
  - kind: job
    path: tools/mgmt-plane-lock/cmd/mgmt-leader-lease/main.go
    symbol: main
  - kind: job
    path: tools/mgmt-plane-lock/cmd/controller-scaler/main.go
    symbol: main
  - kind: cli
    path: tools/mgmt-plane-lock/cmd/mgmt-cli/main.go
    symbol: main
  - kind: http
    path: tools/mgmt-plane-lock/internal/bootstrap/bootstrap.go
