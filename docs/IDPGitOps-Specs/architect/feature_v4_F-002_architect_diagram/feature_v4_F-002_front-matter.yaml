# --- identity: the same contract every hub document carries -------------------
id: "F-002"
feature: "F-002"
version: "v4"
kind: front-matter
title: "Management plane arbitration"
status: ready            # draft | ready | accepted | superseded
owner: Platform Engineering
updated: "2026-09-20"

# --- activation: what an agent decides from the first ten lines ---------------
description: Exactly one management cluster reconciles at a time, decided by a renewable Azure Storage blob lease rather than by configuration, with every governed platform controller following the leadership status that cluster publishes.
globs:                   # the file surface this feature owns; a path outside it is scope creep
  - tools/mgmt-plane-lock/internal/bloblease/**
  - tools/mgmt-plane-lock/internal/scaling/**
  - tools/mgmt-plane-lock/internal/kube/**
  - tools/mgmt-plane-lock/internal/config/**
  - tools/mgmt-plane-lock/internal/bootstrap/**
  - tools/mgmt-plane-lock/cmd/mgmt-leader-lease/**
  - tools/mgmt-plane-lock/cmd/controller-scaler/**
  - tools/mgmt-plane-lock/cmd/mgmt-cli/**
  - gitops/platform/mgmt-plane-lock/**

# --- the cast: identical to the participants of the sequence diagram ----------
