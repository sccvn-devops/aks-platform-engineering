open:
  - "Is the single-replica, 5 s-tick shape of both controllers a deliberate self-healing choice or simply what was built? Nothing records it."
  - "The 120-second recovery objective quoted in docs/architect.md is unobserved — no metric records handover duration. Commitment or estimate?"
  - "Nothing exports whether the two clusters disagree; a split would be visible only by reading both status objects. Is a split-brain detector wanted?"
  - "The metrics route is served with no authentication in code; is it expected to be reachable only from inside the cluster, and is that enforced by a NetworkPolicy anywhere?"
  - "Which consumer reads the lease-status label on the ArgoCD cluster Secret, and is it load-bearing or informational?"
  - "Who is allowed to run mgmt-cli failback or break-lease, and is its use audited?"
  - "Is a frozen control plane, with neither cluster active, acceptable indefinitely, and after how long should it page?"
  - "tools/mgmt-plane-lock/internal/bootstrap is inside this feature's surface but is also used by the rotator (F-004) and by the drift bridge, which has no feature document; a change here reaches both."
  - "The platform decision record lives at _docs/IDP-GitOps-ADRs-v2.md, outside this hub, so the decision identifiers this feature rests on cannot resolve through the route — the hub's decision directory holds only its own first record. Should each cited platform decision get a stub in the hub?"
