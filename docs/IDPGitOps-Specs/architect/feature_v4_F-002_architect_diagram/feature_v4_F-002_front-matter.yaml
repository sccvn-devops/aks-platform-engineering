# --- contracts: named here, shaped in data/ -----------------------------------
contracts:
  endpoints:             # -> data/schema/openapi_v4_F-002.json
    - "GET metrics"
    - "Acquire"
    - "Renew"
    - "Release"
    - "Break"
    - "Read preferred cluster"
    - "Set preferred cluster"
    - "mgmt-cli failback"
    - "mgmt-cli break-lease"
  events: []             # none: both controllers poll; data/schema/asyncapi_v4_F-002.json is empty
  entities:              # $defs names in data/schema/schemas.json
    - lease_controller_config
    - mgmt_leader_status
    - controller_workload
    - cluster_entry

depends_on:
  internal:
    # none inside tools/mgmt-plane-lock: these packages do not use the shared
    # transport seam — the lease goes through the Azure SDK and the rest through client-go.
    - gitops/clusters/registry.yaml
  external:
    - "Go 1.24.0"
    - "Azure Storage blob lease — hard, it is the arbiter"
    - "Kubernetes API in each management cluster — hard, the status object and the replica patches"
    - "ArgoCD cluster Secret — soft, labelled with the lease status"
    - "Prometheus client — the renewal gauge"

# --- the decision `requirement` made ------------------------------------------
approach:
  chosen: Activeness is a renewable external lease, not a stored flag, and the two controllers are decoupled through a cluster-local ConfigMap rather than a shared process.
  because: >-
    Efficiency — one blob and two poll loops, no consensus protocol and no extra
    control-plane dependency; a tick is one metadata read plus at most one lease call.
    Robustness — leader state is set only from a successful acquire and dropped on any
    renew failure, so a cluster cannot believe it is active while the arbiter disagrees,
    and a status value that is neither active nor standby scales nothing up.
    Resilience — possession expires on its own if the holder dies, the status object
    stays readable in-cluster while the arbiter is unreachable, and a planned restart
    drains the lease on a fresh context so the successor does not wait out the term.
  rejected:
    - "A stored activeness flag or operator belief — rejected because nothing would expire it when the holder dies."
    - "Three-cluster arbitration — the design is one blob and one holder; a third cluster is out of scope."
    - "Coupling the two loops in one process — rejected in favour of the ConfigMap seam, so the scaler keeps reconciling from the last published status."
    - "A promotion endpoint — no handler, flag or API sets leadership; the only way to become active is a successful acquire."
  # Bare decision identifiers are deliberately not written here: the platform decision
  # record lives outside this hub, so an identifier in a routed document cannot resolve.
  adr: "_docs/IDP-GitOps-ADRs-v2.md — the management-plane singleton lock (Azure Storage blob lease) and the standby-runs-controllers-at-zero decision"

# --- what must not break ------------------------------------------------------
invariants:
  - DOM-002-R1
  - DOM-002-R2
  - DOM-002-R3
  - DOM-002-R4
  - DOM-002-R5
  - DOM-002-R6
  - DOM-002-R7
  - DOM-002-R8
  - DOM-002-R9
  - DOM-002-R10
  - DOM-002-R11
  - DOM-002-R12

failure_modes:
  - when: another cluster already holds the lease when this one tries to acquire
    expect: publish standby and return from the tick without an error
  - when: a renew is refused because the lease conflicts or no longer exists
    expect: clear leader state and publish standby, surfacing no error
  - when: a renew fails for any other reason
    expect: clear leader state and return the error to the tick, which logs it and retries next tick
  - when: the leadership status is missing or holds a value other than active or standby
    expect: the read errors and nothing is scaled up
  - when: a governed workload is absent from the cluster
    expect: an entry marked optional is skipped and the cycle continues; a required one fails the cycle
  - when: the ArgoCD cluster Secret is not found by the cluster name
    expect: fall back to the cluster-type and cluster-name label selector, then error if the list is empty
  - when: the lease manager or the Kubernetes client is nil when Run is called
    expect: return ErrMissingDependency before the first tick
  - when: a duration variable is unparseable or non-positive
    expect: the loader silently substitutes the default (60 s term, 15 s renew, 5 s poll) and the range check then passes, so the process starts on values the operator did not set
  - when: every governed workload is already at the implied replica count
    expect: issue no patch and report the cycle successful

resilience:              # numbers, not adjectives; every one is testable
  timeout_ms: 5000       # the shutdown drain context; lease and Kubernetes calls inherit the tick context
  retry: "none — the next tick is the retry; the lease loop ticks every 5000 ms and the scaler polls every 5000 ms by default"
  idempotency: "the blob lease ID — Acquire is exclusive, a conflict is not an error, and Release on a lease this cluster does not hold is a no-op"
  degraded: "the mgmt_leader_status ConfigMap stays readable in-cluster while the arbiter is unreachable; a status that cannot be read or is unrecognised scales nothing up, so the failure mode is a frozen control plane rather than two active ones"

observability:
  logs:
    - "lease transitions, through the injectable logger"
    - "scaling decisions, through the injectable logger"
    - "initial reconcile failed"
    - "reconcile failed"
    - "release lease during shutdown"
    - "write standby status during shutdown"
  metrics:
    - mgmt_leader_lease_renewed_seconds
  traces: []             # none: no tracing appears anywhere in the tree

non_goals:
  - Touching tenant workloads — only the declared platform controllers are patched.
  - Data replication or write placement — these packages touch no datastore.
  - Provisioning the arbiter — the blob URL is configuration.
  - Three-cluster arbitration — one blob, one holder.
  - Drift reporting — that is a separate binary.
  - Measuring handover time — no metric records how long a promotion took.

