open:
  - "Why two subcommands rather than one with a dry-run flag is recorded nowhere; the design pair states the shape, not the reason."
  - "Is a transient tracker failure meant to fail the whole seed run, or be retried by the job around it? There is no retry and no rate-limit handling for either vendor API."
  - "Is re-running the intended recovery for a run that created the repository and then failed, and is anything expected to clean up a half-seeded service?"
  - "Is there an intended correlation identifier between the request key, the two change sets and the eventual deployment? Nothing emits one."
  - "DOM-001-R11 destroys hand edits on a re-seed and nothing warns; is a service ever legitimately re-seeded after a human has edited its scaffold?"
