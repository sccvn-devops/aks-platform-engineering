open:
  - "Which validators actually run in CI as opposed to only in pre-commit? The hook list and the workflow steps are maintained separately and nothing enforces parity."
  - "Are the shell validators run anywhere automatically? Only the runner-shape one appears in the pre-commit hook list."
  - "F-003-US1, F-003-US2, F-003-US3 and F-003-US6 have no test, so their acceptance criteria are the validator's own behaviour and nothing verifies it."
  - "DOM-003-R1 is unexercised: the committed baseline holds no suppression to test the rule against."
  - "DOM-003-R5 and DOM-003-R6 are unverified here — the preconditions are evaluated only during terraform plan."
  - "Which mode does CI run the expiry check in? The advisory-or-blocking switch is an environment variable and the answer is not in the tree."
  - "Nothing records how often a gate fires, so the gates' value cannot be measured, and no incident or defect record connects a gate to a prevented failure."
  - "Who owns a failing gate that blocks an unrelated change — the contributor or the platform team? And is there an agreed policy for adding a suppression beyond the three metadata fields?"
