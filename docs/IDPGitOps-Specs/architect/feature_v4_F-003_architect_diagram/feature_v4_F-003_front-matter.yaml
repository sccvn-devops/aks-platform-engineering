# --- identity: the same contract every hub document carries -------------------
id: "F-003"
feature: "F-003"
version: "v4"
kind: front-matter
title: "Platform invariant gates"
status: ready            # draft | ready | accepted | superseded
owner: Platform Engineering
updated: "2026-09-20"

# --- activation: what an agent decides from the first ten lines ---------------
description: Repository-wide platform invariants are enforced by small independent validators that run before a commit and again on a pull request, plus Terraform preconditions that fail the plan, so a violation is a failing check rather than a review comment.
globs:                   # the file surface this feature owns; a path outside it is scope creep
  - scripts/validate-*.py
  - scripts/validate-*.sh
  - scripts/truncate-plan-output.py
  - scripts/tests/**
  - terraform/invariants.tf

