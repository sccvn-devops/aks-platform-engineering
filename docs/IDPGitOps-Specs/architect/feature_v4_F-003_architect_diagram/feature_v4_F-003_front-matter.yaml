    - "python3 scripts/validate-cluster-registry.py"
    - "python3 scripts/validate-tool-version-singleton.py"
    - "python3 scripts/validate-action-pins.py"
    - "python3 scripts/validate-checkov-baseline.py"
    - "python3 scripts/validate-checkov-suppressions.py"
    - "python3 scripts/validate-helm-release-secrets.py"
    - "python3 scripts/validate-workflow-call-contract.py"
    - "python3 scripts/validate-akv-null-expiry.py"
    - "python3 scripts/truncate-plan-output.py"
