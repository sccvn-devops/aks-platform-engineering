    - gitops/clusters/registry.schema.json
  external:
    - "pre-commit — local execution"
    - "GitHub Actions — pull-request execution"
    - "Terraform 1.5.7, tflint 0.55.0, checkov 3.2.345, pinned in .tool-versions"
    - "Python >= 3.10"

# --- the decision `requirement` made ------------------------------------------
approach:
  chosen: One standalone process per invariant over the committed repository text, wired into pre-commit individually and sharing no library, with the cross-variable Terraform invariants expressed as plan-time preconditions instead.
  because: >-
    Efficiency — a validator reads only what is committed, so it runs in milliseconds
    on a laptop and needs no cluster, no credential and no provider call.
    Robustness — each gate is independent, so one failing check cannot mask another,
    and a validator reuses the loader of the code it guards so the two cannot disagree
    about what is parseable.
    Resilience — there is deliberately none to buy: a gate blocks rather than degrades,
    and the one variable behaviour, the expiry check's advisory-or-blocking mode, is
    called out as an open question rather than treated as a feature.
  rejected:
    - "A policy framework or shared validator library — rejected in the tree; eleven scripts share no code, which keeps each gate independently runnable at the cost of duplication."
    - "Admission-time enforcement — that is Kyverno's job, not this feature's; these gates never see a live cluster."
    - "Heuristic secret detection — rejected for a curated sensitive-attribute list, because a false negative here is expensive."
  adr: none              # no ADR records the gate design; the rule each validator enforces is usually only in a comment beside it

# --- what must not break ------------------------------------------------------
invariants:
  - DOM-003-R1
  - DOM-003-R2
  - DOM-003-R3
  - DOM-003-R4
  - DOM-003-R5
  - DOM-003-R6
  - DOM-003-R7
  - DOM-003-R8
  - DOM-003-R9
  - DOM-003-R10

failure_modes:
  - when: a suppression lacks a rationale, an owner or an expiry
    expect: non-zero exit naming the entry index and the missing field
  - when: a toolchain version is declared outside the pin file
    expect: non-zero exit naming the offending file
  - when: a workflow action is referenced by tag rather than by a commit SHA with a tag comment
    expect: a file-and-line annotation and a non-zero exit
  - when: a cluster catalogue entry does not match the committed schema
    expect: non-zero exit naming the entry
  - when: a catalogue key and its cluster name disagree
    expect: the shared loader raises before any consumer sees the entry
  - when: a cluster's short region code is not in the canonical map
    expect: the Terraform precondition fails and the plan aborts with the formatted message
  - when: a spoke network range equals a hub range
    expect: the Terraform precondition fails and the plan aborts before any provider work
  - when: a sensitive value is passed to a chart as a set-value
    expect: non-zero exit naming the release and the attribute, matched against the curated list with one alias hop
  - when: a binary entry point exceeds 40 lines or handles signals itself
    expect: non-zero exit naming the binary
  - when: a platform-managed secret carries no expiry
    expect: advisory mode reports and exits 0; blocking mode exits non-zero — the mode comes from an environment variable

resilience:              # numbers, not adjectives; every one is testable
  timeout_ms: none       # every validator is a local synchronous process over the committed tree; no outbound call
  retry: none            # a gate is deterministic over its input, so re-running it changes nothing
  idempotency: "total — the validators read and never write"
  degraded: "none by design: a gate blocks rather than falls back. The one exception is the expiry check, whose advisory-or-blocking mode is read from NULL_EXPIRY_MODE and is not visible from the script."

observability:
  logs:
    - "GitHub Actions annotation with a level, a file and a line, or the same text plain when that environment variable is absent"
    - "Terraform precondition failure message"
  metrics: []            # none: nothing counts gate failures, time-to-fix or suppressions past expiry
  traces: []             # none

non_goals:
  - Runtime enforcement — every gate runs before or during a pull request, never against a live cluster.
  - Being a policy engine — admission-time enforcement is Kyverno's.
  - Secret scanning beyond private keys and the Helm set-value path.
  - Dependency-update automation — version bumps are operator-driven.
  - Recording a history of violations — the gates are binary and leave no trace beyond a CI log.

