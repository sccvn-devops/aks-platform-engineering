# sonar-project.properties — SonarCloud configuration (US-V3-19, ADR-028-v3)
#
# Scope: Backstage TypeScript (packages/) and Dockerfiles only.
# HCL is excluded — tflint (ADR-026-v3) and checkov (ADR-027-v3) cover that surface.
# No Sonar double-coverage of *.tf per ADR-028-v3 decision #1.

sonar.projectKey=sccvn-devops_aks-platform-engineering
sonar.projectName=IDP Platform Engineering
sonar.organization=sccvn-devops

# Source inclusion: TypeScript under packages/ and any Dockerfile*
sonar.sources=packages/app/src,packages/backend/src
sonar.inclusions=**/*.ts,**/*.tsx,**/Dockerfile*

# Explicit HCL exclusion — belt-and-suspenders alongside inclusions
sonar.exclusions=**/*.tf,**/*.tfvars,**/*.hcl,**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# Test and coverage
sonar.tests=packages/app/src,packages/backend/src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
sonar.typescript.lcov.reportPaths=coverage/lcov.info,packages/app/coverage/lcov.info,packages/backend/coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8
