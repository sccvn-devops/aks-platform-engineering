# dependabot.yml — weekly upgrade PRs (US-V4-11, FR-V4-46).
#
# github-actions group:
#   - All workflow `uses:` are SHA-pinned with `# vX.Y.Z` tag comments.
#     Dependabot natively bumps SHA and comment together when it sees this
#     pattern.  See https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot
#   - All actions are grouped into one PR per week to amortise reviewer cost.
#   - PRs are auto-mergeable subject to standard required-checks review.
#
# Note: .tool-versions is NOT tracked by Dependabot (no ecosystem support).
# Tool version bumps are operator-driven PRs that touch .tool-versions only.

version: 2
updates:

  # github-actions
  - directory: "/"
    package-ecosystem: "github-actions"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      time: "09:00"
      # Use America/New_York Standard Time (UTC -05:00)
      timezone: "America/New_York"
    groups:
      all-github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "dependabot"
      include: scope
    labels:
      - "ok-to-test"
      - "kind/cleanup"
      - "release-note-none"

  # Terraform
  - package-ecosystem: "terraform"
    directories:
      - "/"
      - "/terraform"
    schedule:
      interval: "weekly"
      time: "09:00"
      # Use America/New_York Standard Time (UTC -05:00)
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "dependabot"
      include: scope
    labels:
      - "ok-to-test"
      - "kind/cleanup"
      - "release-note-none"

  # Backstage
  - directory: "/backstage"
    package-ecosystem: "npm"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      time: "09:00"
      # Use America/New_York Standard Time (UTC -05:00)
      timezone: "America/New_York"
    groups:
      all-backstage-patch-updates:
        patterns: ["*"]
        update-types:
          - "patch"
    commit-message:
      prefix: "dependabot"
      include: scope
    labels:
      - "ok-to-test"
      - "kind/cleanup"
      - "release-note-none"

  # pre-commit hook source repos (pre-commit-terraform, pre-commit-hooks).
  # Dependabot bumps `rev:` in .pre-commit-config.yaml for hook source repos.
  - directory: "/"
    package-ecosystem: "pre-commit"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "dependabot"
      include: scope
    labels:
      - "ok-to-test"
      - "kind/cleanup"
      - "release-note-none"
