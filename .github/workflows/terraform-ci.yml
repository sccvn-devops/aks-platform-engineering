# terraform-ci.yml — GitHub Actions meta-CI for platform Terraform (US-V3-12, US-V3-13, US-V4-11)
#
# Runs on every PR targeting main.  Application CI stays on Jenkins (ADR-001-v2).
#
# Gate phases (ADR-025-v3, ADR-027-v3):
#   Day-1  : terraform_fmt, terraform_validate, tflint  — blocking (required status checks in branch protection)
#   Sprint-1: checkov                                   — advisory (soft_fail controlled by .checkov.yaml)
#   Sprint-2: checkov                                   — blocking (flip soft-fail in .checkov.yaml → false)
#
# Tool versions (FR-V4-45): all tool versions come from .tool-versions via the
# jdx/mise-action step in each job.  No `TF_VERSION` / `TFLINT_VERSION` /
# `CHECKOV_VERSION` env var or step input declares them — see
# scripts/validate-tool-version-singleton.py for the round-trip lint.
#
# Action pinning (FR-V4-46): every `uses:` is pinned to a 40-character commit
# SHA with the human-readable tag in a trailing comment.  Dependabot reads the
# comment, bumps both the SHA and the comment together (.github/dependabot.yml).
#
# Branch protection (day-1 required checks — configure once via scripts/setup-branch-protection.sh):
#   Required status checks: "Terraform Format", "Terraform Validate", "TFLint"
#   Checkov is NOT a required check in sprint-1; becomes required in sprint-2.
#
# Required GitHub Secrets:
#   ARM_CLIENT_ID       — platform CI UAMI client ID (OIDC-federated)
#   ARM_TENANT_ID       — Azure AD tenant ID
#   ARM_SUBSCRIPTION_ID — Azure subscription ID
#   GITOPS_ADDONS_ORG   — gitops addons org URL (e.g. https://github.com/myorg)

name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
      - ".github/workflows/terraform-apply.yml"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".checkov.baseline"
      - ".tool-versions"
      - ".pre-commit-config.yaml"
      - "scripts/fetch-tf-secrets.sh"
      - "scripts/setup-branch-protection.sh"
      - "scripts/validate-akv-null-expiry.py"
      - "scripts/validate-akv-catalogue.py"
      - "scripts/validate-action-pins.py"
      - "scripts/validate-checkov-baseline.py"
      - "scripts/validate-tool-version-singleton.py"
      - "scripts/validate-cluster-registry.py"
      - "scripts/validate-workflow-call-contract.py"
      - "scripts/truncate-plan-output.py"
      - "scripts/tests/**"
      - "gitops/clusters/registry.yaml"
      - "gitops/clusters/registry.schema.json"
      - ".github/actions/setup-tf/**"
      - ".github/workflows/reusable/**"

env:
  WORKING_DIR: terraform

# Cancel in-progress runs when a new commit is pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Day-1 gate: terraform fmt (blocking)
  # ---------------------------------------------------------------------------
  format:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
        with:
          version: 2024.11.7
          install: true
          cache: true

      - name: Check formatting
        run: terraform fmt -recursive -check -diff
        working-directory: ${{ env.WORKING_DIR }}

  # ---------------------------------------------------------------------------
  # Day-1 gate: terraform validate (blocking)
  # ---------------------------------------------------------------------------
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
        with:
          version: 2024.11.7
          install: true
          cache: true

      - name: Init (offline — no backend)
        run: terraform init -backend=false -input=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Validate
        run: terraform validate -no-color
        working-directory: ${{ env.WORKING_DIR }}

  # ---------------------------------------------------------------------------
  # Day-1 gate: tflint (blocking)
  # ---------------------------------------------------------------------------
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
        with:
          version: 2024.11.7
          install: true
          cache: true

      - name: Init tflint plugins
        run: tflint --init --config=../.tflint.hcl
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run tflint
        run: tflint --config=../.tflint.hcl --format=compact --recursive
        working-directory: ${{ env.WORKING_DIR }}

  # ---------------------------------------------------------------------------
  # Day-1 gate companion: custom unvalidated-variable detector (US-V3-16, ADR-026-v3)
  # Advisory during ratchet (exits 0); blocking at 100%-coverage cutover (add --block).
  # BLOCKING CUTOVER: remove `|| true` below when 100% variable coverage is declared.
  # ---------------------------------------------------------------------------
  check-var-validation:
    name: Check Variable Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Run check-var-validation
        # Advisory mode (exits 0 even on findings).
        # Sprint-2 cutover: add --block flag to exit 1 on unvalidated variables.
        run: python3 scripts/check-var-validation.py --dir terraform || true

  # ---------------------------------------------------------------------------
  # Inline suppression validator — blocking (day-1). Validates checkov:skip
  # comments have a Jira ticket ref; queries Jira to verify ticket is open
  # and not expired when JIRA_BASE_URL + JIRA_TOKEN are set (ADR-027-v3).
  # ---------------------------------------------------------------------------
  validate-suppressions:
    name: Validate Checkov Suppressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate inline suppressions
        run: |
          python3 scripts/validate-checkov-suppressions.py \
            --dir terraform \
            --jira-url "${JIRA_BASE_URL:-}" \
            --jira-token "${JIRA_TOKEN:-}"
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_TOKEN: ${{ secrets.JIRA_SERVICE_ACCOUNT_TOKEN }}

  # ---------------------------------------------------------------------------
  # AKV null-expiry assertion (US-V3.1-01, FR-V3.1-03).
  # Advisory in sprint-1 (NULL_EXPIRY_MODE=advisory): emits warning annotations
  # and posts findings, but never fails the PR.
  # Sprint-2 cutover: flip NULL_EXPIRY_MODE to "block" in the env block below.
  # ---------------------------------------------------------------------------
  akv-null-expiry:
    name: AKV Null-Expiry Assertion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Run null-expiry assertion
        run: python3 scripts/validate-akv-null-expiry.py
        env:
          # Sprint-2 cutover: change to "block" to fail PRs on null expiry.
          NULL_EXPIRY_MODE: advisory

  # ---------------------------------------------------------------------------
  # AKV catalogue completeness lint (US-V3.1-01, FR-V3.1-05) — blocking.
  # Every azurerm_key_vault_secret / azurerm_key_vault_certificate must appear
  # in the catalogue header at the top of terraform/keyvaults.tf.
  # ---------------------------------------------------------------------------
  akv-catalogue:
    name: AKV Catalogue Completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Run catalogue lint
        run: python3 scripts/validate-akv-catalogue.py

  # ---------------------------------------------------------------------------
  # Action-pin validator (US-V4-11, FR-V4-46) — blocking.
  # Asserts every `uses:` in .github/workflows/* is pinned to a 40-char SHA
  # with a human-readable tag comment.  Dependabot bumps both together.
  # ---------------------------------------------------------------------------
  validate-action-pins:
    name: Validate Action SHA Pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Run validator
        run: python3 scripts/validate-action-pins.py

  # ---------------------------------------------------------------------------
  # Checkov baseline metadata validator (US-V4-11, FR-V4-47) — blocking.
  # Asserts every skipped finding carries rationale + owner + expiry and that
  # expiry is in the future.  See docs/checkov-baseline-metadata-schema.md.
  # ---------------------------------------------------------------------------
  validate-checkov-baseline:
    name: Validate Checkov Baseline Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Run validator
        run: python3 scripts/validate-checkov-baseline.py

  # ---------------------------------------------------------------------------
  # Tool-version singleton lint (US-V4-11, FR-V4-45) — blocking.
  # Asserts no file other than .tool-versions declares terraform / tflint /
  # checkov / terragrunt / kubectl / kustomize versions.  Stops drift at PR
  # time.
  # ---------------------------------------------------------------------------
  validate-tool-version-singleton:
    name: Validate Tool-Version Singleton
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Run validator
        run: python3 scripts/validate-tool-version-singleton.py

  # ---------------------------------------------------------------------------
  # Cluster topology registry schema validator (US-V4-01, FR-V4-04, ADR-031-v4).
  # Blocking from day-1: a registry edit that breaks the schema fails the PR.
  # Runs the registry loader test suite as well, so any divergence between
  # cli.py and the canonical registry shape surfaces in CI rather than at
  # service-seed apply time.
  # ---------------------------------------------------------------------------
  validate-cluster-registry:
    name: Validate Cluster Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema==4.23.0

      - name: Validate registry against JSON Schema
        run: python3 scripts/validate-cluster-registry.py

      - name: Run registry loader unit tests
        run: python3 -m unittest tools.service_seed.tests.test_registry -v

  # ---------------------------------------------------------------------------
  # Pre-commit drift check (US-V4-11, FR-V4-48..49) — blocking.
  # Runs `pre-commit run --all-files` in CI; asserts the resulting working tree
  # diff is empty.  This guarantees CI and pre-commit converge (no formatter
  # drift, no checkov / tflint configuration drift between contexts).
  # ---------------------------------------------------------------------------
  precommit-drift:
    name: Pre-commit Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
        with:
          version: 2024.11.7
          install: true
          cache: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit==3.7.1

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Assert clean working tree
        # If any hook modified a tracked file, fail loudly with the diff so the
        # PR author can fix it locally with `pre-commit run --all-files`.
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::pre-commit hooks modified tracked files — CI/pre-commit drift detected."
            git diff
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Checkov security scan — advisory in sprint-1, blocking in sprint-2.
  # Gate phase is controlled by `soft-fail` in .checkov.yaml (ADR-027-v3).
  # Sprint-2 cutover: set soft-fail: false in .checkov.yaml; do NOT change this file.
  # Runs the mise-installed checkov CLI (FR-V4-45 — version from .tool-versions).
  # ---------------------------------------------------------------------------
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
        with:
          version: 2024.11.7
          install: true
          cache: true

      - name: Run Checkov
        # Configuration and advisory/blocking mode are centralised in .checkov.yaml.
        # Both CI and pre-commit consume the same file (ADR-027-v3, US-V3-18).
        run: |
          checkov \
            --config-file .checkov.yaml \
            --baseline .checkov.baseline \
            --output cli \
            --output sarif \
            --output-file-path console,checkov-results.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57  # v3.36.0
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  # ---------------------------------------------------------------------------
  # workflow_call contract smoke test (US-V4-03, FR-V4-10..14) — blocking.
  # Asserts every `uses: ./.github/workflows/...` invocation passes only
  # declared inputs/secrets and satisfies the callee's required inputs.
  # Static equivalent of `act --workflow_call`; runs act --list opportunistically
  # if the binary is available on the runner.
  # ---------------------------------------------------------------------------
  validate-workflow-call-contract:
    name: Validate Workflow-Call Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml==6.0.2

      - name: Run contract validator
        run: python3 scripts/validate-workflow-call-contract.py

      - name: Run plan-truncation unit tests
        run: python3 -m unittest scripts.tests.test_truncate_plan_output -v

  # ---------------------------------------------------------------------------
  # Terraform plan — delegates to .github/workflows/reusable/terraform-plan.yml
  # via workflow_call.  Matrix-fans across the 7 env-states.  All plan
  # choreography (init, plan, truncation, PR comment) lives in the reusable
  # workflow; this file is now a thin caller (US-V4-03, FR-V4-10).
  # ---------------------------------------------------------------------------
  plan:
    name: Plan (${{ matrix.env }})
    needs: [format, validate, tflint]
    strategy:
      fail-fast: false
      matrix:
        env:
          - mgmt-we
          - mgmt-ne
          - dev
          - staging
          - prod-we
          - prod-ne
          - seed-wus
    uses: ./.github/workflows/reusable/terraform-plan.yml
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    with:
      env: ${{ matrix.env }}
      post_comment: true
    secrets:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      GITOPS_ADDONS_ORG: ${{ secrets.GITOPS_ADDONS_ORG }}
