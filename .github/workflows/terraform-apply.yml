# terraform-apply.yml — thin caller / two-phase matrix orchestrator for
# gated Terraform apply (US-V3-14, US-V4-03, ADR-025-v3, FR-V4-11/14).
#
# Triggered on merge to main (or manual dispatch). Application CI stays on
# Jenkins (ADR-001-v2). All apply choreography lives in the reusable workflow
# at .github/workflows/reusable/terraform-apply.yml. This file declares only
# the two-phase matrix that fans the reusable across env-states.
#
# Two-phase matrix (FR-V4-11):
#   Phase 1: [mgmt-we, mgmt-ne]
#   Phase 2: [dev, staging, prod-we, prod-ne, seed-wus]   needs: apply-phase-1
#
# GitHub Environment protection (FR-V4-14): the reusable callee sets
# `environment: ${{ inputs.env }}`, so each matrix entry inherits the per-env
# reviewer policy from `gh api environments/<env>` (configured by
# scripts/setup-gha-environments.sh).
#
# Each Environment:
#   - Pauses execution until at least two @platform-team members approve
#   - Records reviewer identity in the GHA run history for audit
#   - Restricts the deployment branch to `main` — PRs cannot trigger apply
#
# Tool versions (FR-V4-45) and Azure OIDC env (ADR-030-v3) flow through the
# composite action at .github/actions/setup-tf consumed by the reusable.
#
# OIDC subjects (ADR-030-v3) — federated credential must exist per environment
# in Entra ID: repo:sccvn-devops/aks-platform-engineering:environment:<env>.
# Run scripts/setup-gha-environments.sh once to create the 7 GitHub Environments.
#
# Required GitHub Secrets:
#   ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID, GITOPS_ADDONS_ORG
#
# References:
#   ADR-025-v3 — quality gates + apply gating
#   ADR-030-v3 — OIDC credential sourcing; no plaintext secrets

name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
      - ".github/workflows/reusable/terraform-apply.yml"
      - ".github/workflows/reusable/terraform-plan.yml"
      - ".github/actions/setup-tf/**"
      - ".tool-versions"
      - "scripts/fetch-tf-secrets.sh"
  # Manual dispatch re-applies the full two-phase matrix without a code change.
  # (For single-env re-applies, run the reusable workflow directly via gh-cli
  # `gh workflow run terraform-apply.yml` then approve only the affected
  # environment in the GH Environment review queue.)
  workflow_dispatch: {}

# Serialise concurrent applies per workflow ref to prevent state corruption.
# One concurrent run per env-state is safe; the matrix handles intra-run isolation.
concurrency:
  group: ${{ github.workflow }}-apply
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Pre-apply plan — informational diff for all envs before any apply.
  # Runs without gating so reviewers see the full blast radius before approving.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan (${{ matrix.env }})
    strategy:
      fail-fast: false
      matrix:
        env:
          - mgmt-we
          - mgmt-ne
          - dev
          - staging
          - prod-we
          - prod-ne
          - seed-wus
    uses: ./.github/workflows/reusable/terraform-plan.yml
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    with:
      env: ${{ matrix.env }}
      post_comment: false
    secrets:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      GITOPS_ADDONS_ORG: ${{ secrets.GITOPS_ADDONS_ORG }}

  # ---------------------------------------------------------------------------
  # Stage 2 / Phase 1: management plane (mgmt-we then mgmt-ne in parallel).
  # Each matrix entry inherits its GitHub Environment protection rules via
  # the reusable callee's `environment: ${{ inputs.env }}` (FR-V4-14).
  # ---------------------------------------------------------------------------
  apply-phase-1:
    name: Apply Phase 1 (${{ matrix.env }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        env:
          - mgmt-we
          - mgmt-ne
    uses: ./.github/workflows/reusable/terraform-apply.yml
    permissions:
      id-token: write
      contents: read
    with:
      env: ${{ matrix.env }}
    secrets:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      GITOPS_ADDONS_ORG: ${{ secrets.GITOPS_ADDONS_ORG }}

  # ---------------------------------------------------------------------------
  # Stage 2 / Phase 2: workload + seed clusters.
  # `needs: [apply-phase-1]` enforces phase ordering — workloads cannot apply
  # until both mgmt-we and mgmt-ne succeed (FR-V4-11).
  # ---------------------------------------------------------------------------
  apply-phase-2:
    name: Apply Phase 2 (${{ matrix.env }})
    needs: [plan, apply-phase-1]
    strategy:
      fail-fast: false
      matrix:
        env:
          - dev
          - staging
          - prod-we
          - prod-ne
          - seed-wus
    uses: ./.github/workflows/reusable/terraform-apply.yml
    permissions:
      id-token: write
      contents: read
    with:
      env: ${{ matrix.env }}
    secrets:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      GITOPS_ADDONS_ORG: ${{ secrets.GITOPS_ADDONS_ORG }}
