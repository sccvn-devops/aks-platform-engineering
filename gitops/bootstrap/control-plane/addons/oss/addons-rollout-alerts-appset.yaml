---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-rollout-alerts
  annotations:
    argocd.argoproj.io/sync-wave: "36"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            role: workload
            enable_argo_rollouts: "true"
  template:
    metadata:
      name: addon-{{name}}-rollout-alerts
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}platform/rollout-alerts'
        helm:
          releaseName: rollout-alerts
      destination:
        namespace: argo-rollouts
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
