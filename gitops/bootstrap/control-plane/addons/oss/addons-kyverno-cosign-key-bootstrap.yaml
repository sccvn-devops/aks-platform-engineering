---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-kyverno-cosign-key-bootstrap
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            role: workload
            enable_external_secrets: "true"
            enable_kyverno: "true"
  template:
    metadata:
      name: addon-{{name}}-kyverno-cosign-key-bootstrap
      annotations:
        argocd.argoproj.io/sync-wave: "32"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}platform/external-secrets-bootstrap'
        helm:
          releaseName: kyverno-cosign-key-bootstrap
          values: |
            namespace: kyverno
            azure:
              clientId: "{{metadata.annotations.external_secrets_identity_client_id}}"
              tenantId: "{{metadata.annotations.tenant_id}}"
            vaultUrl: "{{metadata.annotations.external_secrets_vault_url}}"
            externalSecrets:
              - name: cosign-public-key
                targetName: cosign-public-key
                refreshInterval: 1h
                data:
                  - secretKey: cosign.pub
                    remoteRef:
                      key: "secret/{{metadata.annotations.cosign_public_key_secret_name}}"
      destination:
        namespace: kyverno
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
