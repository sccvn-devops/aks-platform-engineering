---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-external-secrets-bootstrap
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            role: workload
            enable_external_secrets: "true"
  template:
    metadata:
      name: addon-{{name}}-external-secrets-bootstrap
      annotations:
        argocd.argoproj.io/sync-wave: "31"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}platform/external-secrets-bootstrap'
        helm:
          releaseName: external-secrets-bootstrap
          values: |
            namespace: platform-secrets
            azure:
              clientId: "{{metadata.annotations.external_secrets_identity_client_id}}"
              tenantId: "{{metadata.annotations.tenant_id}}"
            vaultUrl: "{{metadata.annotations.external_secrets_vault_url}}"
            externalSecrets:
              - name: eso-smoke-test
                targetName: eso-smoke-test
                refreshInterval: 1h
                data:
                  - secretKey: value
                    remoteRef:
                      key: "secret/{{metadata.annotations.external_secrets_smoke_test_secret_name}}"
      destination:
        namespace: external-secrets
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
