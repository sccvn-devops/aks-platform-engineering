---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-mgmt-plane-lock
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            role: management
  template:
    metadata:
      name: addon-{{name}}-mgmt-plane-lock
      annotations:
        argocd.argoproj.io/sync-wave: "28"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}platform/mgmt-plane-lock'
        helm:
          releaseName: mgmt-leader-lease
          values: |
            clusterName: "{{name}}"
            leaseBlobUrl: "{{metadata.annotations.mgmt_lease_blob_url}}"
            azure:
              clientId: "{{metadata.annotations.mgmt_lease_identity_client_id}}"
      destination:
        namespace: kube-system
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
