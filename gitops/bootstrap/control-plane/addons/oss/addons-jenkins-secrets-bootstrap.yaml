---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-jenkins-secrets-bootstrap
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            akuity.io/argo-cd-cluster-name: mgmt-we
            enable_external_secrets: "true"
  template:
    metadata:
      name: addon-{{name}}-jenkins-secrets-bootstrap
      annotations:
        argocd.argoproj.io/sync-wave: "34"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}platform/external-secrets-bootstrap'
        helm:
          releaseName: jenkins-secrets-bootstrap
          values: |
            namespace: jenkins
            azure:
              clientId: "{{metadata.annotations.external_secrets_identity_client_id}}"
              tenantId: "{{metadata.annotations.tenant_id}}"
            vaultUrl: "{{metadata.annotations.external_secrets_vault_url}}"
            externalSecrets:
              - name: jenkins-admin
                targetName: jenkins-admin
                refreshInterval: 1h
                data:
                  - secretKey: jenkins-admin-user
                    remoteRef:
                      key: "secret/{{metadata.annotations.jenkins_admin_username_secret_name}}"
                  - secretKey: jenkins-admin-password
                    remoteRef:
                      key: "secret/{{metadata.annotations.jenkins_admin_password_secret_name}}"
              - name: bitbucket-workspace-token
                targetName: bitbucket-workspace-token
                refreshInterval: 1h
                data:
                  - secretKey: token
                    remoteRef:
                      key: "secret/{{metadata.annotations.jenkins_bitbucket_token_secret_name}}"
              - name: jira-service-account-token
                targetName: jira-service-account-token
                refreshInterval: 1h
                data:
                  - secretKey: token
                    remoteRef:
                      key: "secret/{{metadata.annotations.jenkins_jira_token_secret_name}}"
              - name: jenkins-webhook-https
                targetName: jenkins-webhook-https
                refreshInterval: 1h
                data:
                  - secretKey: jenkins-jks-file
                    remoteRef:
                      key: "secret/{{metadata.annotations.jenkins_https_keystore_secret_name}}"
                      decodingStrategy: Base64
                  - secretKey: https-jks-password
                    remoteRef:
                      key: "secret/{{metadata.annotations.jenkins_https_keystore_password_secret_name}}"
      destination:
        namespace: external-secrets
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
