---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-argocd-jira-bridge-secrets-bootstrap
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            akuity.io/argo-cd-cluster-name: mgmt-we
            enable_external_secrets: "true"
  template:
    metadata:
      name: addon-{{name}}-argocd-jira-bridge-secrets-bootstrap
      annotations:
        argocd.argoproj.io/sync-wave: "37"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}platform/external-secrets-bootstrap'
        helm:
          releaseName: argocd-jira-bridge-secrets-bootstrap
          values: |
            namespace: jira-bridge
            azure:
              clientId: "{{metadata.annotations.external_secrets_identity_client_id}}"
              tenantId: "{{metadata.annotations.tenant_id}}"
            vaultUrl: "{{metadata.annotations.external_secrets_vault_url}}"
            externalSecrets:
              - name: jira-service-account-token
                targetName: jira-service-account-token
                refreshInterval: 1h
                data:
                  - secretKey: token
                    remoteRef:
                      key: "secret/{{metadata.annotations.jenkins_jira_token_secret_name}}"
      destination:
        namespace: external-secrets
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
