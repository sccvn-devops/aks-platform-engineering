---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-crossplane-kubernetes-providerconfigs-workload
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            role: workload
            enable_external_secrets: "true"
  template:
    metadata:
      name: addon-{{name}}-crossplane-kubernetes-providerconfig
      annotations:
        argocd.argoproj.io/sync-wave: "28"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}platform/crossplane-kubernetes-providerconfig'
        helm:
          releaseName: crossplane-kubernetes-providerconfig
          values: |
            providerConfig:
              name: workload-{{name}}
            credentialsSecret:
              name: crossplane-kubeconfig-{{name}}
              namespace: argocd
              key: kubeconfig
      destination:
        namespace: crossplane-system
        name: in-cluster
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
