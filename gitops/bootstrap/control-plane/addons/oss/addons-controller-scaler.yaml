---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-controller-scaler
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            role: management
  template:
    metadata:
      name: addon-{{name}}-controller-scaler
      annotations:
        argocd.argoproj.io/sync-wave: "29"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}platform/controller-scaler'
        helm:
          releaseName: controller-scaler
          values: |
            clusterName: "{{name}}"
      destination:
        namespace: kube-system
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
