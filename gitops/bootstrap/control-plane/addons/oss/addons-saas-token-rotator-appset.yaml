---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-saas-token-rotator
  annotations:
    argocd.argoproj.io/sync-wave: "37"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            role: management
            lease-status: active
  template:
    metadata:
      name: addon-{{name}}-saas-token-rotator
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}platform/saas-token-rotator'
        helm:
          releaseName: saas-token-rotator
          values: |
            keyVaultWeUrl: '{{metadata.annotations.kv_prod_we_url}}'
            keyVaultNeUrl: '{{metadata.annotations.kv_prod_ne_url}}'
            identityClientId: '{{metadata.annotations.saas_rotator_identity_client_id}}'
      destination:
        namespace: saas-token-rotator
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
