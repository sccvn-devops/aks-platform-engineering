---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-velero
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            akuity.io/argo-cd-cluster-name: mgmt-we
  template:
    metadata:
      name: addon-{{name}}-velero
      annotations:
        argocd.argoproj.io/sync-wave: "37"
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: velero
          repoURL: https://vmware-tanzu.github.io/helm-charts
          targetRevision: 12.0.1
          helm:
            releaseName: velero
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/velero/values.yaml
            values: |
              serviceAccount:
                server:
                  create: true
                  name: velero-server
                  annotations:
                    azure.workload.identity/client-id: "{{metadata.annotations.velero_identity_client_id}}"
              podLabels:
                azure.workload.identity/use: "true"
              configuration:
                backupStorageLocation:
                  - name: default
                    provider: azure
                    bucket: "{{metadata.annotations.velero_backup_container_name}}"
                    default: true
                    accessMode: ReadWrite
                    config:
                      resourceGroup: "{{metadata.annotations.velero_backup_resource_group_name}}"
                      storageAccount: "{{metadata.annotations.velero_backup_storage_account_name}}"
                      subscriptionId: "{{metadata.annotations.subscription_id}}"
                      useAAD: "true"
                volumeSnapshotLocation:
                  - name: default
                    provider: azure
                    config:
                      resourceGroup: "{{metadata.annotations.aks_node_resource_group}}"
                      subscriptionId: "{{metadata.annotations.subscription_id}}"
              schedules:
                jenkins-home:
                  disabled: false
                  schedule: "0 */6 * * *"
                  template:
                    includedNamespaces:
                      - jenkins
                    snapshotVolumes: true
                    defaultVolumesToFsBackup: true
                    ttl: "720h"
      destination:
        namespace: velero
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
