---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-kyverno-policies
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                policyPath: platform/kyverno-policies/base
              selector:
                matchExpressions:
                  - key: enable_kyverno
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  role: workload
              values:
                policyPath: platform/kyverno-policies/overlays/workload-audit
          - clusters:
              selector:
                matchLabels:
                  environment: staging
                  role: workload
              values:
                policyPath: platform/kyverno-policies/overlays/workload-enforce
          - clusters:
              selector:
                matchLabels:
                  environment: prod
                  role: workload
              values:
                policyPath: platform/kyverno-policies/overlays/prod-workload
          - clusters:
              selector:
                matchLabels:
                  role: management
              values:
                policyPath: platform/kyverno-policies/overlays/management
  template:
    metadata:
      name: addon-{{name}}-kyverno-policies
      annotations:
        argocd.argoproj.io/sync-wave: "33"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}{{values.policyPath}}'
      destination:
        namespace: kyverno
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
