---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-akv-sync-exporter
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            akuity.io/argo-cd-cluster-name: mgmt-we
  template:
    metadata:
      name: addon-{{name}}-akv-sync-exporter
      annotations:
        argocd.argoproj.io/sync-wave: "35"
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}platform/akv-sync-exporter'
        helm:
          releaseName: akv-sync-exporter
          values: |
            azureClientId: "{{metadata.annotations.akv_sync_exporter_identity_client_id}}"
            vaultWe:
              url: "{{metadata.annotations.kv_prod_we_url}}"
            vaultNe:
              url: "{{metadata.annotations.kv_prod_ne_url}}"
      destination:
        namespace: akv-sync-exporter
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
