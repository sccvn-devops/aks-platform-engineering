# US-V4-09 / FR-V4-36..40 — ExternalSecret for Backstage helm chart.
#
# Materialises a K8s Secret named `backstage-secrets` in the `backstage`
# namespace from the four AKV entries written by Terraform (US-V4-09):
#   - backstage-postgres-password       (was helm_release.set env.POSTGRES_PASSWORD)
#   - backstage-github-token            (was helm_release.set env.GITHUB_TOKEN)
#   - backstage-azure-client-secret     (was helm_release.set env.AZURE_CLIENT_SECRET)
#   - backstage-service-account-token   (was helm_release.set env.K8S_SERVICE_ACCOUNT_TOKEN)
#
# The Backstage chart's pod spec consumes this Secret via `envFrom: secretRef`
# wired by the chart's `envFrom[0].secretRef.name = backstage-secrets` value
# set by the helm_release in terraform/main.tf.
#
# The SecretStore `azure-keyvault-management-ci` is bootstrapped by ESO; see
# gitops/platform/external-secrets-bootstrap/values.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-secrets
  namespace: backstage
  annotations:
    platform.cityos.io/owner: us-v4-09
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: azure-keyvault-management-ci
  target:
    name: backstage-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: backstage-postgres-password
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: backstage-github-token
    - secretKey: AZURE_CLIENT_SECRET
      remoteRef:
        key: backstage-azure-client-secret
    - secretKey: K8S_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: backstage-service-account-token
