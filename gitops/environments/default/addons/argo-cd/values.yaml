controller:
  replicas: 3
  dynamicClusterDistribution: true
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: true
  env:
    - name: ARGOCD_K8S_CLIENT_QPS #required for Crossplane too many CRDs https://github.com/argoproj/argo-cd/pull/448
      value: '300'

repoServer:
  replicas: 2
  autoscaling:
    enabled: false
  resources: # Adjust based on your specific use case (required for HPA)
    requests:
      cpu: '100m'
      memory: '256Mi'
    limits:
      cpu: '200m'
      memory: '512Mi'
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: true

applicationSet:
  replicas: 2
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: true

server:
  replicas: 2
  autoscaling:
    enabled: false
  resources: # Adjust based on your specific use case (required for HPA)
    requests:
      cpu: '100m'
      memory: '256Mi'
    limits:
      cpu: '200m'
      memory: '512Mi'
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: true
  service:
    type: LoadBalancer
    annotations:
      # https://cloud-provider-azure.sigs.k8s.io/topics/loadbalancer/#loadbalancer-annotations
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"

redis-ha:
  enabled: true

configs:
  cm:
    application.resourceTrackingMethod: 'annotation' #use annotation for tracking required for Crossplane
    resource.exclusions: |
      - kinds:
        - ProviderConfigUsage
        apiGroups:
        - "*"
    resource.customizations: |
      "*.platform.cityos.io/*":
        health.lua: |
          hs = {
            status = "Progressing",
            message = "Waiting for Crossplane reconciliation"
          }
          if obj.status ~= nil and obj.status.conditions ~= nil then
            local degraded = nil
            for _, condition in ipairs(obj.status.conditions) do
              if condition.type == "Ready" and condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.message or condition.reason or "Ready"
                return hs
              end
              if condition.type == "Ready" and condition.status == "False" then
                degraded = condition
              end
            end
            if degraded ~= nil then
              hs.status = "Degraded"
              hs.message = degraded.message or degraded.reason or "Not ready"
              return hs
            end
          end
          return hs

# -- Array of extra K8s manifests to deploy
## Note: Supports use of custom Helm templates
##       It gets handle in this form inside the argo-cd chart
# {{ range .Values.extraObjects }}
# ---
# {{ if typeIs "string" . }}
#     {{- tpl . $ }}
# {{- else }}
#     {{- tpl (toYaml .) $ }}
# {{- end }}
# {{ end }}
extraObjects:
  - |
    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: default
      namespace: {{ $.Release.Namespace | quote }}
      annotations:
        source: gitops-brigde
    spec:
      clusterResourceWhitelist:
      - group: '*'
        kind: '*'
      sourceRepos:
        - '*'
      destinations:
        - namespace: '*'
          name: '*'
          server: '*'

global:
  image:
    # repository: quay.io/argoproj/argocd
    # tag: v3.0.0-rc3
    pullPolicy: IfNotPresent
