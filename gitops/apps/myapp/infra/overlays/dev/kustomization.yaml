apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Namespace
      name: placeholder-infra
    patch: |-
      - op: replace
        path: /metadata/name
        value: myapp-infra-dev
      - op: add
        path: /metadata/labels/environment
        value: dev
  - target:
      kind: ConfigMap
      name: myapp-infra-config
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: myapp-infra-dev
      - op: add
        path: /metadata/labels/environment
        value: dev
      - op: replace
        path: /data/environment
        value: dev
