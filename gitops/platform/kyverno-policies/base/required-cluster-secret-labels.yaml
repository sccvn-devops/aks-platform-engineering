apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: kyverno-required-cluster-secret-labels
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-argocd-cluster-secret-labels
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - argocd
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
      validate:
        message: >-
          Argo CD cluster Secrets must define env, region, role, and lease-status labels.
        pattern:
          metadata:
            labels:
              env: "?*"
              region: "?*"
              role: "?*"
              lease-status: "?*"
