apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: storefront
  namespace: app-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
