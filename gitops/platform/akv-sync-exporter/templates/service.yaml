apiVersion: v1
kind: Service
metadata:
  name: {{ include "akv-sync-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: akv-sync-exporter
spec:
  selector:
    app: akv-sync-exporter
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
