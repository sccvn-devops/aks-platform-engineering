apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "akv-sync-exporter.fullname" . }}-script
  namespace: {{ .Release.Namespace }}
data:
  exporter.py: |
    #!/usr/bin/env python3
    """Prometheus exporter for Azure Key Vault dual-write skew measurement.

    Exposes akv_dual_write_skew_seconds{secret_name} for every secret present in
    the West Europe vault, measuring the absolute difference in updated_on timestamps
    between the two regional vaults.  Alert fires when this exceeds 600s (10 min).
    """
    import os
    import time
    import logging
    from http.server import BaseHTTPRequestHandler, HTTPServer

    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger(__name__)

    VAULT_WE = os.environ["VAULT_WE_URL"]
    VAULT_NE = os.environ["VAULT_NE_URL"]
    POLL_INTERVAL = int(os.environ.get("POLL_INTERVAL_SECONDS", "60"))
    PORT = int(os.environ.get("PORT", "9090"))

    # metric store: secret_name -> skew_seconds
    _metrics: dict[str, float] = {}

    def collect():
        try:
            from azure.identity import DefaultAzureCredential
            from azure.keyvault.secrets import SecretClient
        except ImportError:
            log.warning("azure-keyvault-secrets not installed, skipping collection")
            return

        cred = DefaultAzureCredential()
        client_we = SecretClient(vault_url=VAULT_WE, credential=cred)
        client_ne = SecretClient(vault_url=VAULT_NE, credential=cred)

        secrets_we = {s.name: s for s in client_we.list_properties_of_secrets()}
        for name, prop_we in secrets_we.items():
            try:
                prop_ne = client_ne.get_secret_properties(name)
                ts_we = prop_we.updated_on.timestamp() if prop_we.updated_on else 0.0
                ts_ne = prop_ne.updated_on.timestamp() if prop_ne.updated_on else 0.0
                _metrics[name] = abs(ts_we - ts_ne)
            except Exception as exc:
                log.warning("could not read %s from NE vault: %s", name, exc)
                _metrics[name] = float("inf")

    def render_metrics() -> str:
        lines = [
            "# HELP akv_dual_write_skew_seconds Abs time difference between WE and NE AKV secret updated_on",
            "# TYPE akv_dual_write_skew_seconds gauge",
        ]
        for name, skew in _metrics.items():
            lines.append('akv_dual_write_skew_seconds{secret_name="' + name + '"} ' + str(skew))
        return "\n".join(lines) + "\n"

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                body = render_metrics().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            elif self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, *_):
            pass

    def run_collect_loop():
        import threading
        def _loop():
            while True:
                try:
                    collect()
                except Exception as exc:
                    log.error("collection error: %s", exc)
                time.sleep(POLL_INTERVAL)
        t = threading.Thread(target=_loop, daemon=True)
        t.start()

    if __name__ == "__main__":
        # install deps at runtime from wheels baked in image
        import subprocess, sys
        subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet",
                               "azure-keyvault-secrets", "azure-identity"])
        run_collect_loop()
        log.info("Listening on :%d", PORT)
        HTTPServer(("", PORT), Handler).serve_forever()
