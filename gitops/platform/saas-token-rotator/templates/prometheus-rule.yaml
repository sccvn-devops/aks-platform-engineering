{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: saas-token-age
  namespace: {{ .Release.Namespace }}
  labels:
    app: saas-token-rotator
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: saas-token-age
      interval: 3600s
      rules:
        - alert: SaaSTokenAgeExceeded
          expr: saas_token_age_days > {{ .Values.prometheusRule.tokenAgeDaysThreshold }}
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "SaaS token age exceeded: {{ "{{ $labels.token }}" }}"
            description: >-
              Token {{ "{{ $labels.token }}" }} has not been rotated in
              {{ "{{ $value | humanize }}" }} days (threshold: {{ .Values.prometheusRule.tokenAgeDaysThreshold }} days).
              Run the saas-token-rotator CronJob manually or wait for the next scheduled run.
            runbook_url: https://github.com/gitops-bridge-dev/aks-platform-engineering/wiki/runbook-saas-token-age
{{- end }}
