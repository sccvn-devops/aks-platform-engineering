{{- range .Values.certificates }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Values.namespace | quote }}
  annotations:
    platform.cityos.io/cert-slo: "p95-refresh-le-90s"
spec:
  refreshInterval: {{ .refreshInterval | default "60s" | quote }}
  secretStoreRef:
    kind: {{ $.Values.secretStore.kind | default "SecretStore" | quote }}
    name: {{ $.Values.secretStore.name | quote }}
  target:
    name: {{ .targetName | default .name | quote }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ "{{" }} regexFind "(?s)-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----" .pemBundle {{ "}}" }}'
        tls.key: '{{ "{{" }} regexFind "(?s)-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----" .pemBundle {{ "}}" }}'
  data:
    - secretKey: pemBundle
      remoteRef:
        key: "secret/{{ .certName }}"
---
{{- end }}
