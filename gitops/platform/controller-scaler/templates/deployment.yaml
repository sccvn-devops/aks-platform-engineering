apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-scaler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: controller-scaler
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: controller-scaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controller-scaler
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: controller-scaler
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: STATUS_NAMESPACE
              value: kube-system
            - name: STATUS_CONFIGMAP_NAME
              value: mgmt-leader-status
            - name: ARGOCD_NAMESPACE
              value: {{ .Values.argocdNamespace | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.pollIntervalSeconds | quote }}
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
