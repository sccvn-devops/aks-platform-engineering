apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xcosmosaccounts.platform.cityos.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  defaultCompositionRef:
    name: cosmosaccount.azure.platform.cityos.io
  group: platform.cityos.io
  names:
    kind: XCosmosAccount
    plural: xcosmosaccounts
  claimNames:
    kind: CosmosAccount
    plural: cosmosaccounts
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    region:
                      type: string
                      enum:
                        - westeurope
                        - northeurope
                    resourceGroupName:
                      type: string
                    primaryLocation:
                      type: string
                    secondaryLocation:
                      type: string
                    sloClass:
                      type: string
                      enum:
                        - bronze
                        - silver
                        - gold
                      default: bronze
                    secretName:
                      type: string
                      description: Name used for the AKV secret in both regional vaults (e.g. payments-cosmos-conn)
                    keyVaultWeId:
                      type: string
                      description: Azure Resource ID of the West Europe prod Key Vault for dual-write
                    keyVaultNeId:
                      type: string
                      description: Azure Resource ID of the North Europe prod Key Vault for dual-write
                  required:
                    - region
                    - resourceGroupName
                    - primaryLocation
                    - secondaryLocation
                    - secretName
                    - keyVaultWeId
                    - keyVaultNeId
              required:
                - parameters
