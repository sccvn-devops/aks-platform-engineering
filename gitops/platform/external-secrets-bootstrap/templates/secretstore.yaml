apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name | quote }}
  namespace: {{ .Values.namespace | quote }}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ .Values.vaultUrl | quote }}
      serviceAccountRef:
        name: {{ .Values.serviceAccount.name | quote }}
