{{- range .Values.externalSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Values.namespace | quote }}
spec:
  refreshInterval: {{ .refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $.Values.secretStore.name | quote }}
  target:
    name: {{ .targetName | quote }}
    creationPolicy: Owner
  data:
{{ toYaml .data | indent 4 }}
---
{{- end }}
